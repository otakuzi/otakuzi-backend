name: Deploy Backend with Docker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 1. 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 도커 이미지 빌드 & 푸시 (EC2가 아니라 깃허브가 대신 해줌!)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile  # 백엔드 Dockerfile 위치 (루트에 있다면 ./Dockerfile)
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:latest

# 3. EC2에 접속해서 갈아끼우기
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 도커 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # 최신 이미지 다운로드
            docker pull ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:latest
            
            # 기존 컨테이너 멈추고 삭제
            docker stop backend-server || true
            docker rm backend-server || true
            
            # ⭐ 여기가 핵심: 환경변수(-e)를 꽉 채워서 실행!
            docker run -d -p 8080:8080 --name backend-server \
              --restart always \
              -e TZ=Asia/Seoul \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e ADMIN_ID="${{ secrets.ADMIN_ID }}" \
              -e ADMIN_PW="${{ secrets.ADMIN_PW }}" \
              ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:latest
            
            # 청소
            docker image prune -f