name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
      
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: 13.125.214.44
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/app"
      
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: 13.125.214.44
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop otakuzi-backend
            sudo mv /home/ec2-user/app/build/libs/otakuzi-backend-*.jar /home/ec2-user/app/otakuzi-backend.jar
            sudo systemctl start otakuzi-backend