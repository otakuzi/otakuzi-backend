name: Deploy Backend (Prod)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and Test using Docker (TDD Check)
        run: docker build -f Dockerfile.test -t test-build .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:prod

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:prod
            
            docker stop backend-prod || true
            docker rm backend-prod || true
            
            docker run -d -p 8080:8080 --name backend-prod \
              --restart always \
              --network host \
              -e TZ=Asia/Seoul \
              -e JAVA_OPTS="-Xms256m -Xmx384m" \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e RDS_URL_PROD="${{ secrets.RDS_URL_PROD }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e AWS_REGION="ap-northeast-2" \
              -e AWS_EC2_METADATA_V1_DISABLED=false \
              -e AWS_EC2_METADATA_SERVICE_ENDPOINT=http://169.254.169.254 \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/otakuzi/app \
              --log-opt awslogs-stream=prod \
              --log-opt awslogs-create-group=true \
              ${{ secrets.DOCKER_USERNAME }}/otakuzi-backend:prod
              --spring.datasource.driver-class-name=software.amazon.jdbc.Driver
            
            docker image prune -f