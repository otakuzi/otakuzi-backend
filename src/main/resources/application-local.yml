spring:
  datasource:
    driver-class-name: software.amazon.jdbc.Driver
    # AWS RDS 개발용 엔드포인트
    url: ${RDS_URL_DEV}?useAwsIam=true
    username: ${DB_USERNAME}
    password: "" # 비밀번호는 AWS가 알아서 넣으므로 가짜 값

    hikari:
      data-source-properties:
        useAwsIam: "true"

  jpa:
    hibernate:
      # [Local] 개발 편의를 위해 테이블 자동 수정 허용
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: http://localhost:3000/oauth/callback/kakao

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true