spring:
  datasource:
    # AWS RDS 운영용 엔드포인트 (명시적으로)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # ✅ 이건 그대로 OK
    show-sql: false

logging:
  level:
    root: ERROR
    com.otakuzi: INFO

management:
  endpoint:
    health:
      show-details: never