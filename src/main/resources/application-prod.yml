spring:
  # MySQL 운영 설정 (환경변수로 주입)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 운영 설정 (절대 테이블 자동 생성 금지!)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 로그 레벨 (에러만)
logging:
  level:
    root: ERROR
    com.otakuji: INFO

# Actuator 보안 설정
management:
  endpoint:
    health:
      show-details: never