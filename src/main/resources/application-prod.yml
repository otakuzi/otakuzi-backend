spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: software.amazon.jdbc.Driver
    url: ${RDS_URL}
    username: "dummy_name"
    password: "dummy_password"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: ERROR           # 에러만 기록
    com.otakuzi: INFO     # 내 비즈니스 로직은 정보까지 기록

management:
  endpoint:
    health:
      show-details: never # 보안상 상세 정보 숨김