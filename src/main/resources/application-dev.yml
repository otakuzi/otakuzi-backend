spring:
  datasource:
    driver-class-name: software.amazon.jdbc.Driver
    # AWS RDS 개발용 엔드포인트
    url: ${RDS_URL}
    username: "dummy_name"
    password: "dummy_password" # 비밀번호는 AWS가 알아서 넣으므로 가짜 값

    hikari:
      data-source-properties:
        wrapperPlugins: "secretsManager"
        secretsManagerSecretId: "${RDS_SECRET_DEV}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: https://dev.otakuim.com/oauth/callback/kakao

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true