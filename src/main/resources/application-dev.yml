spring:
  datasource:
    driver-class-name: software.amazon.jdbc.Driver
    # AWS RDS 개발용 엔드포인트
    url: ${RDS_URL_DEV}
    username: ${DB_USERNAME}
    password:

    hikari:
      data-source-properties:
        useAwsIam: "true"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: https://dev.otakuim.com/oauth/callback/kakao

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true