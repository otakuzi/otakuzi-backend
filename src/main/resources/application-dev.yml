spring:
  datasource:
    # AWS RDS 개발용 엔드포인트
    url: jdbc:mysql://otakuzi.c144q40k464s.eu-north-1.rds.amazonaws.com:3306/otakuzi?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

